name: profile-guard

# The branch list used to be [master] only. This repo's default branch is `main`
# (origin/HEAD -> origin/main), so the gate had never fired once — a check that never
# runs is decoration, not a check. Both branch names are listed from now on.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify profile facts
        run: node scripts/profile-guard.mjs
      - name: Verify the language-card caption matches the snapshot
        run: node scripts/paint-language-alt.mjs --check
